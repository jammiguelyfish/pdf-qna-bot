name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      # The tests use deterministic fake embeddings and a fake LLM, so the heavy
      # model packages (sentence-transformers, torch) are not needed here.
      - name: Install test dependencies
        run: >
          pip install "numpy<2" langchain==0.1.0 langchain-community==0.0.10 chromadb==0.4.22
          rank-bm25==0.2.2 pypdf==3.17.4 "Django>=5.2,<5.3" "djangorestframework>=3.15,<3.17" pytest
      - name: Compile all modules
        run: python -m compileall -q .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Core tests (retrieval, ingestion lifecycle, evaluation)
        run: python -m pytest -q
      - name: API tests (accounts, documents, chat, isolation)
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
