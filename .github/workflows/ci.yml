name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      # Only the retrieval logic is unit-tested, so skip the heavy model
      # packages (sentence-transformers, chromadb) from requirements.txt.
      - name: Install test dependencies
        run: pip install langchain==0.1.0 langchain-community==0.0.10 rank-bm25==0.2.2 pytest
      - name: Compile all modules
        run: python -m compileall -q .
      - name: Run tests
        run: python -m pytest -q
