# Quick start:   cp .env.example .env   (edit it), then   docker compose up --build
# The app is on http://localhost:8000
services:
  web:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - app-data:/data        # database, uploaded PDFs and the vector index
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-off: downloads the model into the ollama volume, then exits.
  pull-model:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-mistral}"]
    restart: "no"

volumes:
  app-data:
  ollama-models:
